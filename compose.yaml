name: price-tracker
services:
  postgres-db:
    image: postgres:16-alpine
    container_name: price-tracker-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=price_tracker_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - LOG_PATH=/app/logs
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  frankfurter:
    image: lineofflight/frankfurter
    container_name: price-tracker-frankfurter
    restart: unless-stopped
    init: true
    ports:
      - "${FRANKFURTER_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=sqlite:///data/db.sqlite3
    volumes:
      - ./data:/data


  app:
    build: .
    container_name: price-tracker-app
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/price_tracker_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - LOG_PATH=/app/logs
      - SECRET_KEY=${SECRET_KEY}
      - FRANKFURTER_URL=http://frankfurter:8080
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-db:
        condition: service_healthy
      frankfurter:
        condition: service_started
#    ports:
#      - "${APP_PORT:-8080}:8080"
  frontend:
    build:
      context: ../price-tracker-frontend
    container_name: price-tracker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../price-tracker-frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - app


volumes:
  pg-data:
  frontend-node-modules: